<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="ניהול מתפללים, תפילות, תפקידים, אירועים והתחייבויות לבית הכנסת">
  <title>ניהול בית הכנסת</title>
  <link rel="stylesheet" href="synagogue.css?v=2">
</head>
<body>
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true">✦</span><div><strong id="orgName">בית הכנסת</strong><small>ניהול הקהילה</small></div></div>
    <button id="logout" class="quiet" hidden>התנתקות</button>
  </header>
  <main class="shell">
    <aside class="side" id="sidebar" hidden>
      <div class="side-title">סביבת עבודה</div>
      <nav id="sections" aria-label="ניהול בית הכנסת">
        <button data-view="home">השבת הקרובה</button>
        <button data-view="members">מאגר מתפללים</button>
        <button data-view="prayers">תפילות וזמנים</button>
        <button data-view="assignments">גבאות ותפקידים</button>
        <button data-view="events">אירועים ואזכרות</button>
        <button data-view="finances">כספים והתחייבויות</button>
      </nav>
      <div class="side-title">סידור מקומות</div>
      <nav class="links" aria-label="סידור מקומות">
        <a data-href="admin.html">בקשות ומשפחות</a>
        <a data-href="seating.html">מפת הושבה</a>
        <a data-href="layouts.html">תצורות אולם</a>
        <a data-href="index.html">טופס רישום</a>
      </nav>
    </aside>
    <div class="content">
      <div id="tenantBar" class="tenant-bar" hidden>
        <label for="tenantSelect">בית כנסת</label><select id="tenantSelect"></select>
        <button id="refresh" class="quiet" hidden>רענון נתונים</button>
      </div>
      <section id="gate" class="gate" aria-live="polite">
        <h1>ניהול בית הכנסת</h1><p id="gateMessage">בודק הרשאות…</p>
        <button id="login" hidden>התחברות עם Google</button>
        <button id="retry" hidden>ניסיון נוסף</button>
      </section>
      <div id="notice" role="status" aria-live="polite"></div>
      <div id="app" hidden>
        <div class="heading"><div><p class="eyebrow" id="eyebrow">לוח עבודה</p><h1 id="title">השבת הקרובה</h1><p id="subtitle"></p></div><button id="add" class="primary" hidden>הוספת רשומה</button></div>
        <div id="view"></div>
      </div>
    </div>
  </main>
  <dialog id="editor" aria-labelledby="dialogTitle" aria-describedby="formHelp">
    <form id="editForm">
      <div class="dialog-head"><h2 id="dialogTitle">רשומה חדשה</h2><button type="button" id="close" class="icon" aria-label="סגירה">×</button></div>
      <p id="formHelp" class="muted"></p>
      <p id="formError" class="form-error" role="alert" tabindex="-1" hidden></p>
      <div id="fields" class="form-grid"></div>
      <div class="dialog-actions"><button type="button" id="delete" class="danger" hidden>מחיקה</button><span></span><button type="button" id="cancel" class="quiet">ביטול</button><button class="primary" type="submit" id="save">שמירה</button></div>
    </form>
  </dialog>
  <noscript>יש להפעיל JavaScript כדי להשתמש במערכת.</noscript>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
  <script src="generic-common.js?v=5"></script>
  <script src="synagogue-core.js?v=2"></script>
  <script src="synagogue.js?v=2"></script>
</body>
</html>
