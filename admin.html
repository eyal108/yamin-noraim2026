<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ניהול רישום לימים נוראים</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#17211c;background:#f4f1e8}*{box-sizing:border-box}body{margin:0;padding:20px}.wrap{max-width:1100px;margin:auto}h1{margin:0 0 8px}.muted{color:#68716b}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;background:#263d31;color:white}.btn.secondary{background:#fff;color:#263d31;border:1px solid #bfc7c1}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 5px 20px #0001}.num{font-size:28px;font-weight:800}.label{color:#67716a}.tablewrap{overflow:auto;background:white;border-radius:16px;box-shadow:0 5px 20px #0001}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:12px 10px;border-bottom:1px solid #ecefeb;text-align:right}th{background:#f7f8f6;position:sticky;top:0}tr:hover td{background:#fafbf9}.status{margin:10px 0;color:#68716b}@media(max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body><main class="wrap">
<h1>ניהול רישום לימים נוראים</h1><div class="muted">רשימת משפחות וסיכומי מקומות</div>
<div class="toolbar"><button class="btn" id="refresh">רענון</button><button class="btn secondary" id="export">יצוא ל־CSV</button></div>
<div class="cards">
<div class="card"><div class="num" id="rhMen">0</div><div class="label">ראש השנה — גברים</div></div>
<div class="card"><div class="num" id="rhWomen">0</div><div class="label">ראש השנה — נשים</div></div>
<div class="card"><div class="num" id="ykMen">0</div><div class="label">יום כיפור — גברים</div></div>
<div class="card"><div class="num" id="ykWomen">0</div><div class="label">יום כיפור — נשים</div></div>
</div>
<div class="status" id="status">טוען...</div>
<div class="tablewrap"><table><thead><tr><th>משפחה</th><th>ר״ה גברים</th><th>ר״ה נשים</th><th>יו״כ גברים</th><th>יו״כ נשים</th><th>עודכן</th></tr></thead><tbody id="rows"></tbody></table></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://fhilbjbuhtqdwvxhiedz.supabase.co";
const SUPABASE_KEY="sb_publishable_sXoO_u65OB-SPt9OFPiz5A_XMUIIprl";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
let registrations=[];
const sum=k=>registrations.reduce((a,r)=>a+(Number(r[k])||0),0);
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
async function load(){document.getElementById('status').textContent='טוען...';const {data,error}=await db.from('yamim_noraim_registrations').select('family_name,rh_men,rh_women,yk_men,yk_women,updated_at').order('family_name',{ascending:true});if(error){document.getElementById('status').textContent='שגיאה בטעינת הנתונים';return}registrations=data||[];document.getElementById('rhMen').textContent=sum('rh_men');document.getElementById('rhWomen').textContent=sum('rh_women');document.getElementById('ykMen').textContent=sum('yk_men');document.getElementById('ykWomen').textContent=sum('yk_women');document.getElementById('status').textContent=`${registrations.length} משפחות`;document.getElementById('rows').innerHTML=registrations.map(r=>`<tr><td>${esc(r.family_name)}</td><td>${r.rh_men}</td><td>${r.rh_women}</td><td>${r.yk_men}</td><td>${r.yk_women}</td><td>${r.updated_at?new Date(r.updated_at).toLocaleString('he-IL'):''}</td></tr>`).join('')}
function csvCell(v){const s=String(v??'');return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function exportCsv(){const header=['משפחה','ראש השנה גברים','ראש השנה נשים','יום כיפור גברים','יום כיפור נשים','עודכן'];const lines=[header,...registrations.map(r=>[r.family_name,r.rh_men,r.rh_women,r.yk_men,r.yk_women,r.updated_at||''])].map(row=>row.map(csvCell).join(','));const blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='yamim-noraim-registrations.csv';document.body.appendChild(a);a.click();URL.revokeObjectURL(a.href);a.remove()}
document.getElementById('refresh').onclick=load;document.getElementById('export').onclick=exportCsv;load();
</script></body></html>
