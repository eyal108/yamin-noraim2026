<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ניהול רישום לימים נוראים</title><style>:root{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#17211c;background:#f4f1e8}*{box-sizing:border-box}body{margin:0;padding:20px}.wrap{max-width:1250px;margin:auto}h1{margin:0 0 8px}.muted{color:#68716b}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;background:#263d31;color:#fff}.btn.secondary{background:#fff;color:#263d31;border:1px solid #bfc7c1}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 5px 20px #0001}.num{font-size:28px;font-weight:800}.label{color:#67716a}.tablewrap{overflow:auto;background:#fff;border-radius:16px;box-shadow:0 5px 20px #0001}table{width:100%;border-collapse:collapse;min-width:1100px}th,td{padding:9px;border-bottom:1px solid #ecefeb;text-align:right;vertical-align:top}th{background:#f7f8f6;position:sticky;top:0}input,textarea{width:100%;font:inherit;padding:8px;border:1px solid #ccd2cc;border-radius:8px}input[type=number]{width:72px}textarea{min-width:220px;min-height:55px;resize:vertical}.status{margin:10px 0;color:#68716b}.saved{background:#edf4ef}.error{background:#fff0ef;color:#8b2820}@media(max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="wrap"><h1>ניהול רישום לימים נוראים</h1><div class="muted">אפשר לערוך כל שורה ישירות ולשמור.</div><div class="toolbar"><button class="btn" id="refresh">רענון</button><button class="btn secondary" id="export">יצוא ל־CSV</button></div><div class="cards"><div class="card"><div class="num" id="rhMen">0</div><div class="label">ראש השנה — גברים</div></div><div class="card"><div class="num" id="rhWomen">0</div><div class="label">ראש השנה — נשים</div></div><div class="card"><div class="num" id="ykMen">0</div><div class="label">יום כיפור — גברים</div></div><div class="card"><div class="num" id="ykWomen">0</div><div class="label">יום כיפור — נשים</div></div></div><div class="status" id="status">טוען...</div><div class="tablewrap"><table><thead><tr><th>משפחה</th><th>ר״ה גברים</th><th>ר״ה נשים</th><th>יו״כ גברים</th><th>יו״כ נשים</th><th>הערות</th><th>עודכן</th><th>פעולה</th></tr></thead><tbody id="rows"></tbody></table></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://fhilbjbuhtqdwvxhiedz.supabase.co','sb_publishable_sXoO_u65OB-SPt9OFPiz5A_XMUIIprl',{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});let registrations=[];const sum=k=>registrations.reduce((a,r)=>a+(+r[k]||0),0);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function load(){status.textContent='טוען...';const{data,error}=await db.from('yamim_noraim_registrations').select('id,family_name,family_name_normalized,rh_men,rh_women,yk_men,yk_women,notes,updated_at').order('family_name');if(error){status.textContent='שגיאה בטעינת הנתונים';return}registrations=data||[];render()}function render(){rhMen.textContent=sum('rh_men');rhWomen.textContent=sum('rh_women');ykMen.textContent=sum('yk_men');ykWomen.textContent=sum('yk_women');status.textContent=`${registrations.length} משפחות`;rows.innerHTML=registrations.map((r,i)=>`<tr id="row-${i}"><td><input value="${esc(r.family_name)}" data-f="family_name"></td><td><input type="number" min="0" max="6" value="${r.rh_men}" data-f="rh_men"></td><td><input type="number" min="0" max="6" value="${r.rh_women}" data-f="rh_women"></td><td><input type="number" min="0" max="6" value="${r.yk_men}" data-f="yk_men"></td><td><input type="number" min="0" max="6" value="${r.yk_women}" data-f="yk_women"></td><td><textarea data-f="notes">${esc(r.notes||'')}</textarea></td><td>${r.updated_at?new Date(r.updated_at).toLocaleString('he-IL'):''}</td><td><button class="btn" onclick="saveRow(${i})">שמור</button></td></tr>`).join('')}async function saveRow(i){const r=registrations[i],tr=document.getElementById(`row-${i}`);const vals={};tr.querySelectorAll('[data-f]').forEach(el=>vals[el.dataset.f]=el.type==='number'?Number(el.value):el.value.trim());if(!vals.family_name||['rh_men','rh_women','yk_men','yk_women'].some(k=>!Number.isInteger(vals[k])||vals[k]<0||vals[k]>6)){tr.className='error';return}vals.family_name_normalized=vals.family_name.replace(/\s+/g,' ').toLocaleLowerCase('he-IL');const{error}=await db.from('yamim_noraim_registrations').update(vals).eq('id',r.id);if(error){tr.className='error';return}Object.assign(r,vals);tr.className='saved';setTimeout(()=>tr.className='',1200);render()}function csvCell(v){const s=String(v??'');return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}function exportCsv(){const header=['משפחה','ראש השנה גברים','ראש השנה נשים','יום כיפור גברים','יום כיפור נשים','הערות','עודכן'];const lines=[header,...registrations.map(r=>[r.family_name,r.rh_men,r.rh_women,r.yk_men,r.yk_women,r.notes||'',r.updated_at||''])].map(row=>row.map(csvCell).join(','));const blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='yamim-noraim-registrations.csv';a.click();URL.revokeObjectURL(a.href)}refresh.onclick=load;export.onclick=exportCsv;load();</script></body></html>
