<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ניהול המוצר</title><link rel="stylesheet" href="admin-generic.css?v=1"><link rel="stylesheet" href="app-tabs.css?v=1"><style>.productGrid{display:grid;grid-template-columns:minmax(280px,1fr) minmax(320px,1.4fr);gap:16px}.synList,.synDetail{background:#fff;border-radius:16px;padding:16px;box-shadow:0 5px 20px #0001}.synRow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px;border-bottom:1px solid #e7ebe8;cursor:pointer}.synRow.active{background:#eef4f0;border-radius:10px}.synRow.inactive{opacity:.62}.badge{display:inline-block;padding:3px 8px;border-radius:999px;background:#edf1ee;font-size:12px}.badge.on{background:#dff2e4}.badge.off{background:#f5e5e3}.detailActions,.managerAdd{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.managerRow{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #eee}.linkBox{direction:ltr;text-align:left;word-break:break-all;background:#f6f7f6;border-radius:8px;padding:8px}.empty{color:#68716b;padding:12px}@media(max-width:800px){.productGrid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><h1>ניהול המוצר</h1><div class="muted">יצירת בתי כנסת, מנהלים והרשאת AI.</div><nav class="appTabs"><a class="appTab" href="admin.html">ניהול</a><a class="appTab" href="seating.html">סידור מושבים</a><a class="appTab" href="layouts.html">תכנון תצורות</a><a class="appTab active" href="product-admin.html">ניהול מוצר</a></nav><div id="loginGate" class="panel loginGate">בודק הרשאה...</div><div id="productApp" class="hidden"><div class="toolbar"><button id="newSynBtn" class="btn primary">בית כנסת חדש</button><button id="refreshBtn" class="btn">רענון</button><button id="logoutBtn" class="btn">התנתקות</button></div><div id="status" class="status"></div><div class="productGrid"><section class="synList"><h2>בתי כנסת</h2><div id="synList"></div></section><section class="synDetail"><div id="detailEmpty" class="empty">בחר בית כנסת.</div><div id="detail" class="hidden"><h2 id="synName"></h2><div><span id="activeBadge" class="badge"></span> <span id="aiBadge" class="badge"></span></div><div class="detailActions"><button id="renameBtn" class="btn">שנה שם</button><button id="activeBtn" class="btn"></button><button id="aiBtn" class="btn"></button><button id="openAdminBtn" class="btn">פתח ניהול</button></div><h3>קישור לרישום הציבורי</h3><div id="publicLink" class="linkBox"></div><button id="copyLinkBtn" class="btn" style="margin-top:8px">העתק קישור</button><h3>מנהלי בית הכנסת</h3><div class="managerAdd"><input id="managerEmail" type="email" placeholder="כתובת Google של מנהל"><button id="addManagerBtn" class="btn">הוסף מנהל</button></div><div id="managerList"></div></div></section></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="generic-common.js?v=4"></script><script src="product-admin.js?v=2"></script></body></html>
