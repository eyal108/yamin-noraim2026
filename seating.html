<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>סידור הושבה לימים נוראים</title><style>:root{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#17211c;background:#f4f1e8}*{box-sizing:border-box}body{margin:0;padding:16px}.wrap{max-width:1500px;margin:auto}h1{margin:0 0 6px}.muted{color:#68716b}.top{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}.tab,.btn{border:1px solid #bcc7bf;border-radius:10px;padding:10px 15px;background:#fff;font-weight:700;cursor:pointer}.tab.active,.btn.primary{background:#263d31;color:#fff;border-color:#263d31}.layout{display:grid;grid-template-columns:330px 1fr;gap:16px}.side{background:#fff;border-radius:16px;padding:14px;box-shadow:0 5px 20px #0001;max-height:78vh;overflow:auto;position:sticky;top:12px}.family{border:1px solid #d4dad5;border-radius:12px;padding:10px;margin:8px 0;background:#fff;cursor:grab}.family.full{border-right:6px solid #4d8b62}.family.partial{border-right:6px solid #d79b2b}.family.none{border-right:6px solid #c7564a}.family .name{font-weight:800}.family .counts{font-size:14px;margin-top:4px}.note{font-size:12px;color:#69736d;margin-top:4px}.hall{background:#fff;border-radius:16px;padding:14px;box-shadow:0 5px 20px #0001;overflow:auto}.front{display:grid;grid-template-columns:1fr 80px 1fr;gap:8px;align-items:center;margin-bottom:10px;text-align:center;font-weight:700}.front .ark{background:#e7dcc1;padding:8px;border-radius:10px}.front .entrance{background:#e8eef5;padding:8px;border-radius:10px}.sectionTitles{display:grid;grid-template-columns:1.1fr 34px 1fr;gap:8px;margin:6px 0 8px}.sectionTitles div{text-align:center;font-weight:800}.maprow{display:grid;grid-template-columns:minmax(510px,1.1fr) 34px minmax(460px,1fr);gap:8px;margin-bottom:7px}.men,.women{display:flex;gap:8px;direction:ltr}.block{display:flex;gap:4px;direction:ltr}.aisle{background:#f3f0e8;border-radius:8px}.seat{width:42px;height:38px;border:1px solid #9da9a1;border-radius:7px;background:#f8faf8;font-size:10px;line-height:1.05;padding:3px;text-align:center;overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center;direction:rtl}.seat.empty:hover{outline:2px solid #8aa593}.seat.taken{background:#dff0e4;border-color:#7ba287;font-weight:700}.seat.stage{background:#fff1bf;border-color:#d8bd61;cursor:default}.extra{display:flex;gap:4px;justify-content:flex-start;margin:4px 0 8px 50%}.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin-top:12px}.dot{display:inline-block;width:12px;height:12px;border-radius:3px;margin-left:4px;vertical-align:-1px}.status{margin:10px 0;white-space:pre-wrap}.summary{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0 12px}.pill{background:#eef2ef;border-radius:999px;padding:7px 11px;font-size:14px}@media(max-width:1000px){.layout{grid-template-columns:1fr}.side{position:static;max-height:none}.maprow{grid-template-columns:minmax(510px,1fr) 30px minmax(460px,1fr)}}</style></head><body><main class="wrap"><h1>סידור הושבה</h1><div class="muted">גררו משפחה לכיסא. המערכת תשבץ אוטומטית את יתרת המקומות המבוקשת החל מהכיסא שנבחר. לחיצה על כיסא משובץ מסירה אותו.</div><div class="top"><button class="tab active" data-event="rh">ראש השנה</button><button class="tab" data-event="yk">יום כיפור</button><a class="btn" href="admin.html">חזרה לניהול</a><button id="clearEvent" class="btn">איפוס שיבוץ החג</button></div><div class="summary"><span class="pill" id="summaryFamilies"></span><span class="pill" id="summaryMen"></span><span class="pill" id="summaryWomen"></span></div><div class="layout"><aside class="side"><b>משפחות</b><div class="note">ירוק = קיבלו הכול, כתום = חלקי, אדום = עדיין לא קיבלו מקום.</div><div id="families"></div></aside><section class="hall"><div class="front"><div class="entrance">ספרים / חזית</div><div class="ark">ארון קודש</div><div class="entrance">כניסה</div></div><div class="sectionTitles"><div>גברים — 85 מקומות</div><div></div><div>נשים — 82 מקומות</div></div><div id="extraWomen" class="extra"></div><div id="seatMap"></div><div class="legend"><span><i class="dot" style="background:#f8faf8;border:1px solid #9da9a1"></i> פנוי</span><span><i class="dot" style="background:#dff0e4"></i> משובץ</span><span><i class="dot" style="background:#fff1bf"></i> במה</span></div><div id="status" class="status"></div></section></div></main><script>
const REG='https://fhilbjbuhtqdwvxhiedz.supabase.co/rest/v1/yamim_noraim_registrations';
const SEAT='https://fhilbjbuhtqdwvxhiedz.supabase.co/rest/v1/yamim_noraim_seating';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZoaWxiamJ1aHRxZHd2eGhpZWR6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxMzIwMjgsImV4cCI6MjEwMjcwODAyOH0.v4CLQsaEE9cnqRxJv6c_HyA4iSxA3ypqiO3GCM521_w';
const H={'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'};let event='rh',regs=[],assignments=[];const $=id=>document.getElementById(id);
function buildSeats(){const out=[];for(let r=1;r<=8;r++){for(const [block,n] of [['A',4],['B',3],['C',4]])for(let i=1;i<=n;i++)if(!(r===3&&block==='B'))out.push({id:`M-${r}-${block}${i}`,section:'men',row:r,block});for(const [block,n] of [['D',5],['E',5]])for(let i=1;i<=n;i++)out.push({id:`W-${r}-${block}${i}`,section:'women',row:r,block});}out.push({id:'W-X1',section:'women',row:0,block:'X'},{id:'W-X2',section:'women',row:0,block:'X'});return out}const seats=buildSeats();
const reqKey=(sec)=>event==='rh'?(sec==='men'?'rh_men':'rh_women'):(sec==='men'?'yk_men':'yk_women');
const assigned=(family,sec)=>assignments.filter(a=>a.event===event&&a.section===sec&&a.family_name===family).length;
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function load(){$('status').textContent='טוען...';try{const [rr,ss]=await Promise.all([fetch(REG+'?select=family_name,rh_men,rh_women,yk_men,yk_women,notes&order=family_name.asc',{headers:H}),fetch(SEAT+'?select=id,event,section,seat_id,family_name&event=eq.'+event,{headers:H})]);if(!rr.ok||!ss.ok)throw new Error('שגיאה בקריאת הנתונים');regs=await rr.json();assignments=await ss.json();render();$('status').textContent='השינויים נשמרים אוטומטית.'}catch(e){$('status').textContent='שגיאה: '+e.message}}
function render(){renderFamilies();renderMap();const needM=regs.reduce((s,r)=>s+(+r[reqKey('men')]||0),0),needW=regs.reduce((s,r)=>s+(+r[reqKey('women')]||0),0);$('summaryFamilies').textContent=regs.length+' משפחות';$('summaryMen').textContent=`גברים: ${assignments.filter(a=>a.section==='men').length}/${needM} משובצים`;$('summaryWomen').textContent=`נשים: ${assignments.filter(a=>a.section==='women').length}/${needW} משובצות`}
function renderFamilies(){const list=regs.filter(r=>(+r[reqKey('men')]||0)+(+r[reqKey('women')]||0)>0);$('families').innerHTML=list.map(r=>{const nm=assigned(r.family_name,'men'),nw=assigned(r.family_name,'women'),rm=+r[reqKey('men')]||0,rw=+r[reqKey('women')]||0,total=rm+rw,got=nm+nw,cls=got>=total?'full':got>0?'partial':'none';return `<div class="family ${cls}" draggable="true" data-family="${esc(r.family_name)}"><div class="name">${esc(r.family_name)}</div><div class="counts">גברים ${nm}/${rm} · נשים ${nw}/${rw}</div>${r.notes?`<div class="note">${esc(r.notes)}</div>`:''}</div>`}).join('');document.querySelectorAll('.family').forEach(el=>el.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',el.dataset.family)))}
function seatHtml(s){const a=assignments.find(x=>x.seat_id===s.id);return `<div class="seat ${a?'taken':'empty'}" data-seat="${s.id}" data-section="${s.section}" title="${a?esc(a.family_name):'פנוי'}">${a?esc(a.family_name):''}</div>`}
function renderMap(){$('extraWomen').innerHTML=seats.filter(s=>s.row===0).map(seatHtml).join('');let html='';for(let r=1;r<=8;r++){const group=(sec,b)=>seats.filter(s=>s.row===r&&s.section===sec&&s.block===b);html+=`<div class="maprow"><div class="men"><div class="block">${group('men','A').map(seatHtml).join('')}</div><div class="block">${r===3?'<div class="seat stage">במה</div><div class="seat stage">במה</div><div class="seat stage">במה</div>':group('men','B').map(seatHtml).join('')}</div><div class="block">${group('men','C').map(seatHtml).join('')}</div></div><div class="aisle"></div><div class="women"><div class="block">${group('women','D').map(seatHtml).join('')}</div><div class="block">${group('women','E').map(seatHtml).join('')}</div></div></div>`}$('seatMap').innerHTML=html;document.querySelectorAll('.seat[data-seat]').forEach(el=>{el.addEventListener('dragover',e=>e.preventDefault());el.addEventListener('drop',e=>{e.preventDefault();assignFamily(e.dataTransfer.getData('text/plain'),el.dataset.seat)});el.addEventListener('click',()=>{if(el.classList.contains('taken'))unassignSeat(el.dataset.seat)})})}
async function assignFamily(family,startId){const seat=seats.find(s=>s.id===startId);if(!seat)return;const reg=regs.find(r=>r.family_name===family);if(!reg)return;const need=+reg[reqKey(seat.section)]||0,got=assigned(family,seat.section),remaining=need-got;if(remaining<=0){alert('המשפחה כבר קיבלה את כל המקומות שביקשה בצד זה.');return}const occupied=new Set(assignments.map(a=>a.seat_id));const order=seats.filter(s=>s.section===seat.section&&s.row>0);if(seat.row===0)order.unshift(...seats.filter(s=>s.section===seat.section&&s.row===0));const idx=order.findIndex(s=>s.id===startId);const candidates=[...order.slice(idx),...order.slice(0,idx)].filter(s=>!occupied.has(s.id));const chosen=candidates.slice(0,remaining);if(!chosen.length)return;try{for(const s of chosen){const res=await fetch(SEAT+'?on_conflict=event,seat_id',{method:'POST',headers:{...H,'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({event,section:s.section,seat_id:s.id,family_name:family})});if(!res.ok)throw new Error(await res.text())}await load()}catch(e){$('status').textContent='שגיאה בשמירה: '+e.message}}
async function unassignSeat(id){const a=assignments.find(x=>x.seat_id===id);if(!a)return;if(!confirm(`להסיר את ${a.family_name} מהמקום הזה?`))return;const res=await fetch(SEAT+'?event=eq.'+event+'&seat_id=eq.'+encodeURIComponent(id),{method:'DELETE',headers:H});if(!res.ok){$('status').textContent='שגיאה בהסרת המקום';return}await load()}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{event=t.dataset.event;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));load()});$('clearEvent').onclick=async()=>{if(!confirm('לאפס את כל השיבוץ לחג הנבחר? הפעולה תמחק את כל הקצאות המקומות לחג זה.'))return;const res=await fetch(SEAT+'?event=eq.'+event,{method:'DELETE',headers:H});if(res.ok)load();else $('status').textContent='שגיאה באיפוס'};load();
</script></body></html>
