<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>סידור הושבה לימים נוראים</title><style>:root{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#17211c;background:#f4f1e8}*{box-sizing:border-box}body{margin:0;padding:16px}.wrap{max-width:1500px;margin:auto}h1{margin:0 0 6px}.muted{color:#68716b}.top{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}.tab,.btn{border:1px solid #bcc7bf;border-radius:10px;padding:10px 15px;background:#fff;font-weight:700;cursor:pointer}.tab.active,.btn.primary{background:#263d31;color:#fff;border-color:#263d31}.layout{display:grid;grid-template-columns:330px 1fr;gap:16px}.side{background:#fff;border-radius:16px;padding:14px;box-shadow:0 5px 20px #0001;max-height:78vh;overflow:auto;position:sticky;top:12px}.family{border:1px solid #d4dad5;border-radius:12px;padding:10px;margin:8px 0;background:#fff;cursor:grab}.family.full{border-right:6px solid #4d8b62}.family.partial{border-right:6px solid #d79b2b}.family.none{border-right:6px solid #c7564a}.family .name{font-weight:800}.family .counts{font-size:14px;margin-top:4px}.note{font-size:12px;color:#69736d;margin-top:4px}.hall{background:#fff;border-radius:16px;padding:14px;box-shadow:0 5px 20px #0001;overflow:auto}.front{display:grid;grid-template-columns:1fr 100px 1fr;gap:8px;align-items:center;margin-bottom:12px;text-align:center;font-weight:700}.front .ark{background:#e7dcc1;padding:8px;border-radius:10px}.front .entrance{background:#e8eef5;padding:8px;border-radius:10px}.sectionTitles{display:grid;grid-template-columns:1fr 44px 1fr;gap:10px;margin:6px 0 10px}.sectionTitles div{text-align:center;font-weight:800}.maprow{display:grid;grid-template-columns:minmax(520px,1fr) 44px minmax(470px,1fr);gap:10px;margin-bottom:8px;align-items:center}.men,.women{display:flex;gap:18px;direction:ltr;align-items:center}.block{display:flex;gap:4px;direction:ltr}.aisle{height:44px;background:repeating-linear-gradient(90deg,#f4f1e8 0 10px,#fff 10px 20px);border-radius:8px}.seat{width:42px;height:38px;border:1px solid #9da9a1;border-radius:7px;background:#f8faf8;font-size:10px;line-height:1.05;padding:3px;text-align:center;overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center;direction:rtl}.seat.empty:hover{outline:2px solid #8aa593}.seat.taken{background:#dff0e4;border-color:#7ba287;font-weight:700}.seat.last-extra{background:#eef6ff}.rowlabel{width:24px;text-align:center;color:#7a847d;font-size:12px}.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin-top:12px}.dot{display:inline-block;width:12px;height:12px;border-radius:3px;margin-left:4px;vertical-align:-1px}.status{margin:10px 0;white-space:pre-wrap}.summary{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0 12px}.pill{background:#eef2ef;border-radius:999px;padding:7px 11px;font-size:14px}.layoutdesc{background:#f8faf8;border:1px solid #dde4df;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}@media(max-width:1000px){.layout{grid-template-columns:1fr}.side{position:static;max-height:none}.maprow{grid-template-columns:minmax(520px,1fr) 36px minmax(470px,1fr)}}</style></head><body><main class="wrap"><h1>סידור הושבה</h1><div class="muted">גררו משפחה לכיסא. המערכת תשבץ את יתרת המקומות המבוקשת. לחיצה על כיסא משובץ מסירה אותו.</div><div class="top"><button class="tab active" data-event="rh">ראש השנה</button><button class="tab" data-event="yk">יום כיפור</button><button class="tab active" data-layout="1">תצורה 1</button><button class="tab" data-layout="2">תצורה 2</button><a class="btn" href="admin.html">חזרה לניהול</a><button id="clearEvent" class="btn">איפוס שיבוץ החג</button></div><div class="summary"><span class="pill" id="summaryFamilies"></span><span class="pill" id="summaryMen"></span><span class="pill" id="summaryWomen"></span></div><div class="layout"><aside class="side"><b>משפחות</b><div class="note">ירוק = קיבלו הכול, כתום = חלקי, אדום = עדיין לא קיבלו מקום.</div><div id="families"></div></aside><section class="hall"><div class="front"><div class="entrance">חזית / ספרים</div><div class="ark">ארון קודש</div><div class="entrance">כניסה</div></div><div id="layoutDesc" class="layoutdesc"></div><div class="sectionTitles"><div id="menTitle">גברים</div><div></div><div id="womenTitle">נשים</div></div><div id="seatMap"></div><div class="legend"><span><i class="dot" style="background:#f8faf8;border:1px solid #9da9a1"></i> פנוי</span><span><i class="dot" style="background:#dff0e4"></i> משובץ</span><span><i class="dot" style="background:#eef6ff"></i> תוספת בשורה 8</span></div><div id="status" class="status"></div></section></div></main><script>
const REG='https://fhilbjbuhtqdwvxhiedz.supabase.co/rest/v1/yamim_noraim_registrations';
const SEAT='https://fhilbjbuhtqdwvxhiedz.supabase.co/rest/v1/yamim_noraim_seating';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZoaWxiamJ1aHRxZHd2eGhpZWR6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxMzIwMjgsImV4cCI6MjEwMjcwODAyOH0.v4CLQsaEE9cnqRxJv6c_HyA4iSxA3ypqiO3GCM521_w';
const H={'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'};let event='rh',layoutNo=1,regs=[],assignments=[];const $=id=>document.getElementById(id);
const layouts={1:{men:[4,3,4],women:[5,5],menExtra:2,womenExtra:1,desc:'תצורה 1: גברים 4–3–4, נשים 5–5. בין הטורים יש מעבר. בשורה 8 אין מעבר ולכן מתווספים 2 כיסאות לגברים וכיסא אחד לנשים.'},2:{men:[4,3,3],women:[6,5],menExtra:2,womenExtra:1,desc:'תצורה 2: גברים 4–3–3, נשים 6–5. בשורה 8 כמו בתצורה 1 — ללא מעבר, עם 2 כיסאות נוספים לגברים וכיסא נוסף לנשים.'}};
function buildSeats(){const cfg=layouts[layoutNo],out=[];for(let r=1;r<=8;r++){for(let b=0;b<cfg.men.length;b++){const n=cfg.men[b];for(let i=1;i<=n;i++)out.push({id:`L${layoutNo}-M-${r}-${b}-${i}`,section:'men',row:r,block:b,extra:false});}for(let b=0;b<cfg.women.length;b++){const n=cfg.women[b];for(let i=1;i<=n;i++)out.push({id:`L${layoutNo}-W-${r}-${b}-${i}`,section:'women',row:r,block:b,extra:false});}if(r===8){for(let i=1;i<=cfg.menExtra;i++)out.push({id:`L${layoutNo}-M-8-X-${i}`,section:'men',row:8,block:'x',extra:true});for(let i=1;i<=cfg.womenExtra;i++)out.push({id:`L${layoutNo}-W-8-X-${i}`,section:'women',row:8,block:'x',extra:true});}}return out}
let seats=buildSeats();
const reqKey=(sec)=>event==='rh'?(sec==='men'?'rh_men':'rh_women'):(sec==='men'?'yk_men':'yk_women');
const assigned=(family,sec)=>assignments.filter(a=>a.event===event&&a.section===sec&&a.family_name===family).length;
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function load(){$('status').textContent='טוען...';try{const [rr,ss]=await Promise.all([fetch(REG+'?select=family_name,rh_men,rh_women,yk_men,yk_women,notes&order=family_name.asc',{headers:H}),fetch(SEAT+'?select=id,event,section,seat_id,family_name&event=eq.'+event,{headers:H})]);if(!rr.ok||!ss.ok)throw new Error('שגיאה בקריאת הנתונים');regs=await rr.json();assignments=(await ss.json()).filter(a=>a.seat_id.startsWith(`L${layoutNo}-`));render();$('status').textContent='השינויים נשמרים אוטומטית.'}catch(e){$('status').textContent='שגיאה: '+e.message}}
function render(){renderFamilies();renderMap();const needM=regs.reduce((s,r)=>s+(+r[reqKey('men')]||0),0),needW=regs.reduce((s,r)=>s+(+r[reqKey('women')]||0),0);$('summaryFamilies').textContent=regs.length+' משפחות';$('summaryMen').textContent=`גברים: ${assignments.filter(a=>a.section==='men').length}/${needM} משובצים`;$('summaryWomen').textContent=`נשים: ${assignments.filter(a=>a.section==='women').length}/${needW} משובצות`;const cfg=layouts[layoutNo];$('menTitle').textContent=`גברים — ${cfg.men.join('–')} (${cfg.men.reduce((a,b)=>a+b,0)*7+cfg.men.reduce((a,b)=>a+b,0)+cfg.menExtra} מושבים)`;$('womenTitle').textContent=`נשים — ${cfg.women.join('–')} (${cfg.women.reduce((a,b)=>a+b,0)*7+cfg.women.reduce((a,b)=>a+b,0)+cfg.womenExtra} מושבים)`;$('layoutDesc').textContent=cfg.desc}
function renderFamilies(){const list=regs.filter(r=>(+r[reqKey('men')]||0)+(+r[reqKey('women')]||0)>0);$('families').innerHTML=list.map(r=>{const nm=assigned(r.family_name,'men'),nw=assigned(r.family_name,'women'),rm=+r[reqKey('men')]||0,rw=+r[reqKey('women')]||0,total=rm+rw,got=nm+nw,cls=got>=total?'full':got>0?'partial':'none';return `<div class="family ${cls}" draggable="true" data-family="${esc(r.family_name)}"><div class="name">${esc(r.family_name)}</div><div class="counts">גברים ${nm}/${rm} · נשים ${nw}/${rw}</div>${r.notes?`<div class="note">${esc(r.notes)}</div>`:''}</div>`}).join('');document.querySelectorAll('.family').forEach(el=>el.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',el.dataset.family)))}
function seatHtml(s){const a=assignments.find(x=>x.seat_id===s.id);return `<div class="seat ${a?'taken':'empty'} ${s.extra?'last-extra':''}" data-seat="${s.id}" data-section="${s.section}" title="${a?esc(a.family_name):'פנוי'}">${a?esc(a.family_name):''}</div>`}
function renderSide(row,section,counts){let blocks='';counts.forEach((n,b)=>{const group=seats.filter(s=>s.row===row&&s.section===section&&s.block===b);blocks+=`<div class="block">${group.map(seatHtml).join('')}</div>`});if(row===8){const extra=seats.filter(s=>s.row===8&&s.section===section&&s.extra);if(extra.length)blocks+=`<div class="block">${extra.map(seatHtml).join('')}</div>`}return blocks}
function renderMap(){const cfg=layouts[layoutNo];let html='';for(let r=1;r<=8;r++){html+=`<div class="maprow"><div class="men"><span class="rowlabel">${r}</span>${renderSide(r,'men',cfg.men)}</div><div class="aisle"></div><div class="women">${renderSide(r,'women',cfg.women)}<span class="rowlabel">${r}</span></div></div>`}$('seatMap').innerHTML=html;document.querySelectorAll('.seat[data-seat]').forEach(el=>{el.addEventListener('dragover',e=>e.preventDefault());el.addEventListener('drop',e=>{e.preventDefault();assignFamily(e.dataTransfer.getData('text/plain'),el.dataset.seat)});el.addEventListener('click',()=>{if(el.classList.contains('taken'))unassignSeat(el.dataset.seat)})})}
async function assignFamily(family,startId){const seat=seats.find(s=>s.id===startId);if(!seat)return;const reg=regs.find(r=>r.family_name===family);if(!reg)return;const need=+reg[reqKey(seat.section)]||0,got=assigned(family,seat.section),remaining=need-got;if(remaining<=0){alert('המשפחה כבר קיבלה את כל המקומות שביקשה בצד זה.');return}const occupied=new Set(assignments.map(a=>a.seat_id));const sameRow=seats.filter(s=>s.section===seat.section&&s.row===seat.row);const idx=sameRow.findIndex(s=>s.id===startId);const candidates=[...sameRow.slice(idx),...sameRow.slice(0,idx),...seats.filter(s=>s.section===seat.section&&s.row!==seat.row)].filter(s=>!occupied.has(s.id));const chosen=candidates.slice(0,remaining);if(!chosen.length)return;try{for(const s of chosen){const res=await fetch(SEAT+'?on_conflict=event,seat_id',{method:'POST',headers:{...H,'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({event,section:s.section,seat_id:s.id,family_name:family})});if(!res.ok)throw new Error(await res.text())}await load()}catch(e){$('status').textContent='שגיאה בשמירה: '+e.message}}
async function unassignSeat(id){const a=assignments.find(x=>x.seat_id===id);if(!a)return;if(!confirm(`להסיר את ${a.family_name} מהמקום הזה?`))return;const res=await fetch(SEAT+'?event=eq.'+event+'&seat_id=eq.'+encodeURIComponent(id),{method:'DELETE',headers:H});if(!res.ok){$('status').textContent='שגיאה בהסרת המקום';return}await load()}
document.querySelectorAll('.tab[data-event]').forEach(t=>t.onclick=()=>{event=t.dataset.event;document.querySelectorAll('.tab[data-event]').forEach(x=>x.classList.toggle('active',x===t));load()});document.querySelectorAll('.tab[data-layout]').forEach(t=>t.onclick=()=>{layoutNo=Number(t.dataset.layout);seats=buildSeats();document.querySelectorAll('.tab[data-layout]').forEach(x=>x.classList.toggle('active',x===t));load()});$('clearEvent').onclick=async()=>{if(!confirm('לאפס את כל השיבוץ לחג הנבחר ולתצורה הנבחרת?'))return;const prefix=`L${layoutNo}-`;const list=assignments.filter(a=>a.seat_id.startsWith(prefix));for(const a of list){await fetch(SEAT+'?event=eq.'+event+'&seat_id=eq.'+encodeURIComponent(a.seat_id),{method:'DELETE',headers:H})}load()};load();
</script></body></html>
