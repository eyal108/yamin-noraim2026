<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>סידור הושבה לימים נוראים</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#17211c;background:#f4f1e8;--seat:42px;--seat-h:38px;--gap:4px}
*{box-sizing:border-box}body{margin:0;padding:16px}.wrap{max-width:1550px;margin:auto}h1{margin:0 0 5px}.muted{color:#68716b}.top{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:14px 0}.tab,.btn{border:1px solid #bcc7bf;border-radius:10px;padding:9px 14px;background:#fff;font-weight:700;cursor:pointer;color:#263d31;text-decoration:none}.tab.active,.btn.primary{background:#263d31;color:#fff;border-color:#263d31}.groupLabel{font-weight:800;margin-right:8px}.summary{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 14px}.pill{background:#eef2ef;border-radius:999px;padding:7px 11px;font-size:14px}.layout{display:grid;grid-template-columns:320px minmax(900px,1fr);gap:16px}.side,.hall{background:#fff;border-radius:16px;padding:14px;box-shadow:0 5px 20px #0001}.side{max-height:82vh;overflow:auto;position:sticky;top:12px}.family{border:1px solid #d4dad5;border-radius:12px;padding:9px;margin:8px 0;background:#fff;cursor:grab}.family.full{border-right:6px solid #4d8b62}.family.partial{border-right:6px solid #d79b2b}.family.none{border-right:6px solid #c7564a}.family .name{font-weight:800}.family .counts{font-size:14px;margin-top:3px}.note{font-size:12px;color:#69736d;margin-top:4px}.hall{overflow:auto}.front{display:grid;grid-template-columns:1fr 120px 1fr;gap:8px;align-items:center;text-align:center;font-weight:800;margin-bottom:12px}.front div{padding:8px;border-radius:10px}.ark{background:#e7dcc1}.frontside{background:#e8eef5}.desc{background:#f8faf8;border:1px solid #dde4df;border-radius:12px;padding:9px 12px;margin-bottom:12px;font-size:14px}.hallGrid{display:grid;grid-template-columns:max-content 56px max-content;gap:18px;align-items:start;direction:ltr}.divider{width:56px;min-height:420px;background:#faf8f2;border-radius:12px}.section{direction:rtl}.sectionTitle{text-align:center;font-weight:900;margin:0 0 8px;padding:8px;border-radius:10px;background:#eef4f0}.womenTitle{background:#f8eef3}.rowline{display:flex;align-items:center;height:44px;margin-bottom:4px;direction:ltr}.rownum{width:28px;text-align:center;font-size:12px;color:#7a847d;flex:0 0 28px}.seat,.stageSeat{width:var(--seat);height:var(--seat-h);flex:0 0 var(--seat);border-radius:7px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:10px;line-height:1.05;padding:2px;overflow:hidden;direction:rtl}.seat{border:1px solid #9da9a1;background:#f8faf8;cursor:pointer}.seat.empty:hover{outline:2px solid #8aa593}.seat.taken{background:#dff0e4;border-color:#7ba287;font-weight:800}.seat.extra{background:#eef6ff}.stageSeat{background:#fff1bf;border:1px solid #d8bd61;font-weight:800}.block{display:flex;gap:var(--gap);direction:ltr}.aisle{width:var(--seat);height:var(--seat-h);flex:0 0 var(--seat);background:repeating-linear-gradient(135deg,#f5f1e7 0 6px,#fff 6px 12px);border-radius:5px;margin:0 4px}.stageBlock{display:flex;width:calc(var(--seat)*3 + var(--gap)*2);height:var(--seat-h);align-items:center;justify-content:center;background:#fff1bf;border:1px solid #d8bd61;border-radius:7px;font-weight:900;margin:0}.lastAisleSeat{margin:0 4px}.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin-top:13px}.dot{display:inline-block;width:12px;height:12px;border-radius:3px;margin-left:4px;vertical-align:-1px}.status{margin-top:10px;white-space:pre-wrap}.capacity{font-size:12px;color:#68716b;font-weight:600;margin-right:5px}@media(max-width:1150px){.layout{grid-template-columns:1fr}.side{position:static;max-height:none}.hallGrid{grid-template-columns:max-content 42px max-content}}
</style>
</head>
<body><main class="wrap">
<h1>סידור הושבה</h1>
<div class="muted">גררו משפחה לכיסא פנוי. המערכת תשבץ את יתרת המקומות המבוקשת. לחיצה על כיסא משובץ מסירה אותו.</div>
<div class="top">
<span class="groupLabel">חג:</span><button class="tab eventTab active" data-event="rh">ראש השנה</button><button class="tab eventTab" data-event="yk">יום כיפור</button>
<span class="groupLabel">תצורה:</span><button class="tab layoutTab active" data-layout="1">תצורה 1</button><button class="tab layoutTab" data-layout="2">תצורה 2</button>
<a class="btn" href="admin.html">חזרה לניהול</a><button id="clearLayout" class="btn">איפוס התצורה הנוכחית</button>
</div>
<div class="summary"><span class="pill" id="summaryFamilies"></span><span class="pill" id="summaryMen"></span><span class="pill" id="summaryWomen"></span></div>
<div class="layout">
<aside class="side"><b>משפחות</b><div class="note">ירוק = הושלם, כתום = חלקי, אדום = עדיין לא שובץ.</div><div id="families"></div></aside>
<section class="hall">
<div class="front"><div class="frontside">חזית / ספרים</div><div class="ark">ארון קודש</div><div class="frontside">כניסה</div></div>
<div id="layoutDesc" class="desc"></div>
<div class="hallGrid"><section class="section" id="menSection"><div class="sectionTitle">גברים <span class="capacity" id="menCapacity"></span></div><div id="menMap"></div></section><div class="divider"></div><section class="section" id="womenSection"><div class="sectionTitle womenTitle">נשים <span class="capacity" id="womenCapacity"></span></div><div id="womenMap"></div></section></div>
<div class="legend"><span><i class="dot" style="background:#f8faf8;border:1px solid #9da9a1"></i> פנוי</span><span><i class="dot" style="background:#dff0e4"></i> משובץ</span><span><i class="dot" style="background:#fff1bf"></i> במה</span><span><i class="dot" style="background:#eef6ff"></i> כיסא במקום מעבר בשורה 8</span></div>
<div id="status" class="status"></div>
</section></div></main>
<script>
const REG='https://fhilbjbuhtqdwvxhiedz.supabase.co/rest/v1/yamim_noraim_registrations';
const SEAT='https://fhilbjbuhtqdwvxhiedz.supabase.co/rest/v1/yamim_noraim_seating';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZoaWxiamJ1aHRxZHd2eGhpZWR6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxMzIwMjgsImV4cCI6MjEwMjcwODAyOH0.v4CLQsaEE9cnqRxJv6c_HyA4iSxA3ypqiO3GCM521_w';
const H={'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'};
const layouts={
  1:{men:[4,3,4],women:[5,5],desc:'תצורה 1 — גברים: 4 | 3 | 4, נשים: 5 | 5. המעברים בין הטורים הם בדיוק ברוחב כיסא. בשורה 8 אין מעבר: במקום כל מעבר נמצא כיסא נוסף. בגברים הטור האמצעי בשורות 2–3 הוא במה.'},
  2:{men:[4,3,3],women:[6,5],desc:'תצורה 2 — גברים: 4 | 3 | 3, נשים: 6 | 5. המעברים ברוחב כיסא; בשורה 8 המעברים מוחלפים בכיסאות. גם כאן בגברים הטור האמצעי בשורות 2–3 הוא במה.'}
};
let event='rh',layoutNo=1,regs=[],assignments=[],seats=[];const $=id=>document.getElementById(id);
const reqKey=sec=>event==='rh'?(sec==='men'?'rh_men':'rh_women'):(sec==='men'?'yk_men':'yk_women');
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function buildSeats(){const cfg=layouts[layoutNo],out=[];for(let r=1;r<=8;r++){
  cfg.men.forEach((n,b)=>{if((r===2||r===3)&&b===1)return;for(let i=1;i<=n;i++)out.push({id:`L${layoutNo}-M-${r}-B${b}-${i}`,section:'men',row:r,block:b,order:i,extra:false})});
  if(r===8){out.push({id:`L${layoutNo}-M-8-A0`,section:'men',row:8,block:'a0',order:1,extra:true});out.push({id:`L${layoutNo}-M-8-A1`,section:'men',row:8,block:'a1',order:1,extra:true})}
  cfg.women.forEach((n,b)=>{for(let i=1;i<=n;i++)out.push({id:`L${layoutNo}-W-${r}-B${b}-${i}`,section:'women',row:r,block:b,order:i,extra:false})});
  if(r===8)out.push({id:`L${layoutNo}-W-8-A0`,section:'women',row:8,block:'a0',order:1,extra:true});
}return out}
function assigned(family,sec){return assignments.filter(a=>a.section===sec&&a.family_name===family).length}
async function load(){seats=buildSeats();$('status').textContent='טוען...';try{const [rr,sr]=await Promise.all([
 fetch(REG+'?select=family_name,rh_men,rh_women,yk_men,yk_women,notes&order=family_name.asc',{headers:H}),
 fetch(SEAT+'?select=id,event,section,seat_id,family_name&event=eq.'+event,{headers:H})]);
 if(!rr.ok||!sr.ok)throw new Error('שגיאה בקריאת הנתונים');regs=await rr.json();assignments=(await sr.json()).filter(a=>a.seat_id.startsWith(`L${layoutNo}-`));render();$('status').textContent='השינויים נשמרים אוטומטית.'}catch(e){$('status').textContent='שגיאה: '+e.message}}
function render(){renderFamilies();renderMaps();const needM=regs.reduce((s,r)=>s+(+r[reqKey('men')]||0),0),needW=regs.reduce((s,r)=>s+(+r[reqKey('women')]||0),0);$('summaryFamilies').textContent=regs.filter(r=>(+r[reqKey('men')]||0)+(+r[reqKey('women')]||0)>0).length+' משפחות';$('summaryMen').textContent=`גברים: ${assignments.filter(a=>a.section==='men').length}/${needM} משובצים`;$('summaryWomen').textContent=`נשים: ${assignments.filter(a=>a.section==='women').length}/${needW} משובצות`;$('layoutDesc').textContent=layouts[layoutNo].desc;$('menCapacity').textContent='— '+seats.filter(s=>s.section==='men').length+' כיסאות';$('womenCapacity').textContent='— '+seats.filter(s=>s.section==='women').length+' כיסאות'}
function renderFamilies(){const list=regs.filter(r=>(+r[reqKey('men')]||0)+(+r[reqKey('women')]||0)>0);$('families').innerHTML=list.map(r=>{const rm=+r[reqKey('men')]||0,rw=+r[reqKey('women')]||0,nm=assigned(r.family_name,'men'),nw=assigned(r.family_name,'women'),need=rm+rw,got=nm+nw,cls=got>=need?'full':got>0?'partial':'none';return `<div class="family ${cls}" draggable="true" data-family="${esc(r.family_name)}"><div class="name">${esc(r.family_name)}</div><div class="counts">גברים ${nm}/${rm} · נשים ${nw}/${rw}</div>${r.notes?`<div class="note">${esc(r.notes)}</div>`:''}</div>`}).join('');document.querySelectorAll('.family').forEach(el=>el.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',el.dataset.family)))}
function seatHtml(s,extraClass=''){const a=assignments.find(x=>x.seat_id===s.id);return `<div class="seat ${a?'taken':'empty'} ${s.extra?'extra':''} ${extraClass}" data-seat="${s.id}" data-section="${s.section}" title="${a?esc(a.family_name):'פנוי'}">${a?esc(a.family_name):''}</div>`}
function blockHtml(section,row,b){const group=seats.filter(s=>s.section===section&&s.row===row&&s.block===b).sort((a,b)=>a.order-b.order);return `<div class="block">${group.map(s=>seatHtml(s)).join('')}</div>`}
function menRow(r){const cfg=layouts[layoutNo];let inner=blockHtml('men',r,0);if(r===8){const e0=seats.find(s=>s.id===`L${layoutNo}-M-8-A0`);inner+=seatHtml(e0,'lastAisleSeat')}else inner+='<div class="aisle" title="מעבר"></div>';
 if(r===2||r===3)inner+='<div class="stageBlock">במה</div>';else inner+=blockHtml('men',r,1);
 if(r===8){const e1=seats.find(s=>s.id===`L${layoutNo}-M-8-A1`);inner+=seatHtml(e1,'lastAisleSeat')}else inner+='<div class="aisle" title="מעבר"></div>';
 inner+=blockHtml('men',r,2);return `<div class="rowline"><span class="rownum">${r}</span>${inner}</div>`}
function womenRow(r){let inner=blockHtml('women',r,0);if(r===8){const e0=seats.find(s=>s.id===`L${layoutNo}-W-8-A0`);inner+=seatHtml(e0,'lastAisleSeat')}else inner+='<div class="aisle" title="מעבר"></div>';inner+=blockHtml('women',r,1);return `<div class="rowline"><span class="rownum">${r}</span>${inner}</div>`}
function renderMaps(){$('menMap').innerHTML=Array.from({length:8},(_,i)=>menRow(i+1)).join('');$('womenMap').innerHTML=Array.from({length:8},(_,i)=>womenRow(i+1)).join('');document.querySelectorAll('.seat[data-seat]').forEach(el=>{el.addEventListener('dragover',e=>e.preventDefault());el.addEventListener('drop',e=>{e.preventDefault();assignFamily(e.dataTransfer.getData('text/plain'),el.dataset.seat)});el.addEventListener('click',()=>{if(el.classList.contains('taken'))unassignSeat(el.dataset.seat)})})}
function rowOrder(section,row){const cfg=layouts[layoutNo];if(section==='men'){
 let ids=[];ids.push(...seats.filter(s=>s.section==='men'&&s.row===row&&s.block===0));if(row===8)ids.push(seats.find(s=>s.id===`L${layoutNo}-M-8-A0`));if(row!==2&&row!==3)ids.push(...seats.filter(s=>s.section==='men'&&s.row===row&&s.block===1));if(row===8)ids.push(seats.find(s=>s.id===`L${layoutNo}-M-8-A1`));ids.push(...seats.filter(s=>s.section==='men'&&s.row===row&&s.block===2));return ids.filter(Boolean)}
 let ids=[];ids.push(...seats.filter(s=>s.section==='women'&&s.row===row&&s.block===0));if(row===8)ids.push(seats.find(s=>s.id===`L${layoutNo}-W-8-A0`));ids.push(...seats.filter(s=>s.section==='women'&&s.row===row&&s.block===1));return ids.filter(Boolean)}
function sectionOrder(section,startId){const start=seats.find(s=>s.id===startId);if(!start)return[];const first=rowOrder(section,start.row);const idx=first.findIndex(s=>s.id===startId);let order=[...first.slice(idx),...first.slice(0,idx)];for(let r=1;r<=8;r++)if(r!==start.row)order.push(...rowOrder(section,r));return order}
async function assignFamily(family,startId){const start=seats.find(s=>s.id===startId);if(!start)return;const reg=regs.find(r=>r.family_name===family);if(!reg)return;const need=+reg[reqKey(start.section)]||0,got=assigned(family,start.section),remaining=need-got;if(remaining<=0){alert('המשפחה כבר קיבלה את כל המקומות שביקשה בצד זה.');return}const occupied=new Set(assignments.map(a=>a.seat_id));const chosen=sectionOrder(start.section,startId).filter(s=>!occupied.has(s.id)).slice(0,remaining);if(!chosen.length)return;try{for(const s of chosen){const res=await fetch(SEAT+'?on_conflict=event,seat_id',{method:'POST',headers:{...H,'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({event,section:s.section,seat_id:s.id,family_name:family})});if(!res.ok)throw new Error(await res.text())}await load()}catch(e){$('status').textContent='שגיאה בשמירה: '+e.message}}
async function unassignSeat(id){const a=assignments.find(x=>x.seat_id===id);if(!a)return;if(!confirm(`להסיר את ${a.family_name} מהמקום הזה?`))return;const res=await fetch(SEAT+'?event=eq.'+event+'&seat_id=eq.'+encodeURIComponent(id),{method:'DELETE',headers:H});if(res.ok)load();else $('status').textContent='שגיאה בהסרת המקום'}
document.querySelectorAll('.eventTab').forEach(t=>t.onclick=()=>{event=t.dataset.event;document.querySelectorAll('.eventTab').forEach(x=>x.classList.toggle('active',x===t));load()});
document.querySelectorAll('.layoutTab').forEach(t=>t.onclick=()=>{layoutNo=Number(t.dataset.layout);document.querySelectorAll('.layoutTab').forEach(x=>x.classList.toggle('active',x===t));load()});
$('clearLayout').onclick=async()=>{if(!confirm('לאפס את כל השיבוצים בחג ובתצורה הנוכחיים?'))return;const prefix=`L${layoutNo}-`;const mine=assignments.filter(a=>a.seat_id.startsWith(prefix));for(const a of mine){await fetch(SEAT+'?event=eq.'+event+'&seat_id=eq.'+encodeURIComponent(a.seat_id),{method:'DELETE',headers:H})}load()};
load();
</script></body></html>
